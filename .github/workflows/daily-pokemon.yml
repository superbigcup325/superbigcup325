# 每天随机画一只宝可梦更新到 README。
# 精灵数据来自 superbigcup325/Pokefetch（素材上游 pokemon-colorscripts，MIT）。
# 闪光率自行掷骰 1/128，与 pokefetch 随机模式一致（显式 -n 时工具本身不出闪光）。

name: daily pokemon

on:
  schedule:
    # 目标：北京时间早上 8 点前后更新。
    # GitHub 对 schedule 的队列延迟实测有 3–5 小时（2026-11 各次实际落在 03:3x–05:0x UTC），
    # 所以 cron 取 UTC 21:00（= CST 05:00），落地约 08:00–10:00 CST。
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-pokemon

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: superbigcup325/Pokefetch
          path: pokefetch

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pokefetch

      - name: Build pokefetch
        run: cargo build --release --manifest-path pokefetch/Cargo.toml

      - name: Draw today's pokemon
        run: |
          NAME=$(ls pokefetch/assets/colorscripts/large/regular | shuf -n 1)
          SHINY=""
          if [ $((RANDOM % 128)) -eq 0 ]; then SHINY="-s"; fi
          echo "today: $NAME ${SHINY:-}"
          pokefetch/target/release/pokefetch -n "$NAME" $SHINY -b --raw > poke.ans
          python3 ansi2svg.py poke.ans pokemon.svg
          {
            echo "NAME=$NAME"
            echo "SHINY=$([ -n "$SHINY" ] && echo yes || echo no)"
          } >> "$GITHUB_ENV"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pokemon.svg; then
            echo "sprite unchanged, nothing to commit"
            exit 0
          fi
          git add pokemon.svg
          MSG="🎨 $NAME"
          if [ "$SHINY" = yes ]; then MSG="$MSG ✨"; fi
          git commit -m "$MSG"
          # push 偶发被 GitHub 侧 403（token 瞬时没有写权限，重跑即成功），
          # 这里重试几次吃掉这种抖动，免得整次任务变红、当天的精灵跟着丢掉。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 第 $i 次失败，10 秒后重试" >&2
            sleep 10
          done
          echo "push 连续 3 次失败，放弃" >&2
          exit 1
